<!-- templates/registrar.html -->
{% extends 'base.html' %}

{% block title %}Registrar{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-primary text-white d-flex align-items-center">
                    <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Studio Duo" height="36" class="me-2 logo-moldura">
                    <h4 class="mb-0">Studio Duo · Criar Conta</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="papel" class="form-label">Perfil</label>
                            <select class="form-select" id="papel" name="papel">
                                <option value="gestora">Proprietária / Gestora</option>
                                <option value="professora">Professora</option>
                                <option value="aluno">Aluno</option>
                            </select>
                            <div class="form-text">Para o perfil Aluno, use o mesmo e-mail cadastrado na ficha para visualizar seus dados.</div>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Registrar</button>
                        </div>
                    </form>
                    <div class="mt-3 text-center">
                        <p>Já tem uma conta? <a href="{{ url_for('login') }}">Faça login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
