<!-- templates/index.html -->
{% extends 'base.html' %}

{% block title %}Início{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3 text-center">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Studio Duo" class="mb-3 rounded" style="max-height: 140px;">
            <h1 class="display-4">Studio Duo</h1>
            <p class="lead">Gestão de alunos, mensalidades e acompanhamento pedagógico, com análise de risco de evasão.</p>
            <div class="mt-4">
                <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg me-2">Login</a>
                <a href="{{ url_for('registrar') }}" class="btn btn-outline-primary btn-lg">Criar Conta</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
